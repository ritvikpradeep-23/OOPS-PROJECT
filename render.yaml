# Render blueprint for the Spring Boot backend (Vercel hosts only the frontend).
# Render asks for the values marked sync: false when you create the service.
services:
  - type: web
    name: disaster-relief-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/public/stats
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
